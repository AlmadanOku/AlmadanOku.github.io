name: Weekly AI Blog Post

on:
  schedule:
    - cron: '0 9 * * 1' # Her Pazartesi saat 09:00'da çalışır (UTC)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu klonla
        uses: actions/checkout@v2

      - name: Python kurulumu
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Gerekli paketleri yükle
        run: pip install openai markdown

      - name: Blog yazısı oluştur
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python <<EOF
          import openai
          import datetime

          openai.api_key = "${{ secrets.OPENAI_API_KEY }}"

          today = datetime.date.today().strftime('%Y-%m-%d')

          topic = "Güneş Enerjili Ürünler İncelemesi"

          response = openai.ChatCompletion.create(
              model="gpt-3.5-turbo",
              messages=[
                  {"role": "system", "content": "Sen SEO uyumlu Türkçe blog yazarı olarak davran."},
                  {"role": "user", "content": f"{topic} hakkında 800 kelimelik SEO uyumlu, affiliate link içeren bir blog yazısı yaz. Alt başlıklar, avantaj-dezavantaj analizi ve ürün önerileri de olsun."}
              ]
          )

          content = response['choices'][0]['message']['content']

          filename = f"_posts/{today}-ai-post.md"
          with open(filename, "w") as f:
              f.write(f"---\\nlayout: post\\ntitle: \\"{topic} - {today}\\"\\ndate: {today}\\n---\\n\\n")
              f.write(content)

          EOF

      - name: Değişiklikleri GitHub'a gönder
        run: |
          git config --global user.email "ai-bot@almadanoku.com"
          git config --global user.name "AI Bot"
          git add _posts/*.md
          git commit -m "Yeni AI içerik eklendi"
          git push
